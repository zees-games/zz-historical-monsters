# Infected Thylacine (the Tasmanian wolf, extinct 1936). Every key is optional: delete one and the built-in default applies.
# It moves and fights as the tiger does (claw, bleed, pounce), lighter and with these numbers. Limbs: see trex.yml.
# Override one value: --zz_historical_monsters.thylacine.health=500
thylacine:
